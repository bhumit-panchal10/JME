<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            color: #1f2937;
        }

        .construction-page {
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            text-align: center;
        }

        .construction-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 70px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9edf3;
        }

        /* Icon */
        .icon-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: #fff7e6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
        }

        .construction-card h1 {
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 18px;
            color: #111827;
            font-weight: 700;
        }

        .construction-card h1 span {
            color: #f59e0b;
        }

        .construction-card p {
            max-width: 650px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.7;
            color: #6b7280;
        }

        /* Progress */
        .progress-section {
            max-width: 500px;
            margin: 40px auto 0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #6b7280;
        }

        .progress-bar {
            height: 10px;
            width: 100%;
            background: #edf0f4;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            width: 75%;
            height: 100%;
            background: #f59e0b;
            border-radius: 20px;
        }

        /* Contact */
        .contact {
            margin-top: 35px;
            font-size: 15px;
            color: #6b7280;
        }

        .contact a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: 600;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #9ca3af;
        }

        /* Mobile */
        @media (max-width: 768px) {

            .construction-card {
                padding: 50px 25px;
                border-radius: 18px;
            }

            .construction-card h1 {
                font-size: 36px;
            }

            .construction-card p {
                font-size: 16px;
            }

            .icon-wrapper {
                width: 90px;
                height: 90px;
                font-size: 42px;
            }
        }

        @media (max-width: 480px) {

            .construction-page {
                padding: 20px 15px;
            }

            .construction-card {
                padding: 40px 20px;
            }

            .construction-card h1 {
                font-size: 30px;
            }

            .construction-card p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="construction-page">

        <div class="construction-card">

            <div class="icon-wrapper">
                🚧
            </div>

            <h1>
                Website <span>Under Construction</span>
            </h1>

            <p>
                We're currently working on something amazing.
                Our website is getting a fresh new look and will be
                available soon.
            </p>
